<!DOCTYPE html>
<html>

    <head>
        <title>Calculator</title>
        <link rel="stylesheet" type="text/css" href="calculator.css">
    </head>

    <body>
        <h1>Calculator</h1>

        <form id="form" name="calculator">

            <input name="display" style="width:700px;height:100px;text-align:center;background-color: #000000;">

            <input type=button value="1" onClick="calculator.display.value+='1'" style="background-color:#808080;">
            <input type=button value="2" onClick="calculator.display.value+='2'" style="background-color:#808080;">
            <input type=button value="3" onClick="calculator.display.value+='3'" style="background-color:#808080;">
            <input type=button value="+" onClick="calculator.display.value+='+'" style="background-color:#808080;"> </br>
            <input type=button value="4" onClick="calculator.display.value+='4'" style="background-color:#808080;">
            <input type=button value="5" onClick="calculator.display.value+='5'" style="background-color:#808080;">
            <input type=button value="6" onClick="calculator.display.value+='6'" style="background-color:#808080;">
            <input type=button value="-" onClick="calculator.display.value+='-'" style="background-color:#808080;"> </br>
            <input type=button value="7" onClick="calculator.display.value+='7'" style="background-color:#808080;">
            <input type=button value="8" onClick="calculator.display.value+='8'" style="background-color:#808080;">
            <input type=button value="9" onClick="calculator.display.value+='9'" style="background-color:#808080;">
            <input type=button value="x" onClick="calculator.display.value+='*'" style="background-color:#808080;"> <br>
            <input type=button value="0" onClick="calculator.display.value+='0'" style="background-color:#808080;">
            <input type=button value="C" onClick="calculator.display.value=''" style="background-color:#ff0000;">
            <input type=button value="=" onClick="calculator.display.value=eval(calculator.display.value)" style="background-color:#808080;">
            <input type=button value="&#247;" onClick="calculator.display.value+='/'" style="background-color:#808080;">
            
        </form>
    </body>







</html>
